<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>LoongCode - 把 Claude Code 装进桌面的 AI Agent IDE</title>
  <meta name="description" content="LoongCode 是一个基于 Tauri 2 + React 19 的跨平台桌面应用，本质上是 Claude Code CLI 的图形化外壳。">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a3e 100%);
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      text-align: center;
      animation: fadeIn 0.8s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
      background: linear-gradient(135deg, #6d5efc 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1.2em;
      color: #a0a0c0;
      margin-bottom: 2em;
      line-height: 1.6;
    }

    .links {
      display: flex;
      gap: 1em;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2em;
    }

    .btn {
      padding: 0.75em 1.5em;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      display: inline-block;
      border: 2px solid;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6d5efc 0%, #a78bfa 100%);
      color: white;
      border-color: transparent;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(109, 94, 252, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: #a0a0c0;
      border-color: #a0a0c0;
    }

    .btn-secondary:hover {
      color: #e0e0e0;
      border-color: #e0e0e0;
      background: rgba(160, 160, 192, 0.1);
    }

    .nav-links {
      display: flex;
      gap: 2em;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 3em;
      padding-top: 2em;
      border-top: 1px solid rgba(160, 160, 192, 0.3);
      font-size: 0.9em;
    }

    .nav-links a {
      color: #6d5efc;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #a78bfa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LoongCode</h1>
    <div class="tagline">
      把 Claude Code 装进桌面的 AI Agent IDE<br>
      Tauri 2 + React 19 跨平台桌面应用
    </div>

    <div class="links">
      <a href="https://release.loongcode.cc" class="btn btn-primary">版本时间线 & 下载</a>
      <a href="https://docs.loongcode.cc" class="btn btn-secondary">完整使用指南</a>
    </div>

    <div class="nav-links">
      <a href="https://github.com/LoongCode0/loongcode-release" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://release.loongcode.cc" target="_blank" rel="noopener noreferrer">Releases</a>
      <a href="https://docs.loongcode.cc" target="_blank" rel="noopener noreferrer">文档</a>
    </div>
  </div>
</body>
</html>
